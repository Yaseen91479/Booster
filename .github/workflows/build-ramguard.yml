name: Build RAM Guard Probe

on:
  push:
    branches: [ main ]
    paths:
      - 'ramguard/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-ramguard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug and release APKs
        run: |
          gradle --no-daemon :ramguard:assembleDebug :ramguard:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ram-guard-probe-apks
          path: |
            ramguard/build/outputs/apk/debug/*.apk
            ramguard/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
